name: Deploy Vercel Frontends

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: surroundshow-web
          - app: funfirst-web
          - app: redwave-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Build inside the Actions runner (full monorepo checked out), then
      # upload the prebuilt output. Deploying the app folder alone made
      # Vercel's remote install fail on workspace:* packages.
      - name: Build and deploy to Vercel
        working-directory: apps/${{ matrix.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel link --yes --project "${{ matrix.app }}" --token "$VERCEL_TOKEN"
          VERCEL_ORG_ID=$(node -p "require('./.vercel/project.json').orgId")
          VERCEL_PROJECT_ID=$(node -p "require('./.vercel/project.json').projectId")
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed ${{ matrix.app }} -> $url"
          {
            echo "### Vercel Deploy: ${{ matrix.app }}"
            echo "URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
