name: Deploy Vercel Frontends

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: surroundshow-web
          - app: funfirst-web
          - app: redwave-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Upload the full monorepo (not just apps/<app>) so workspace:* packages
      # resolve on Vercel. Each project's Root Directory is set to apps/<app>,
      # and that app's vercel.json runs install/build from the repo root.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          APP="${{ matrix.app }}"

          vercel link --yes --project "$APP" --token "$VERCEL_TOKEN" --cwd "apps/$APP"
          ORG_ID=$(node -p "require('./apps/$APP/.vercel/project.json').orgId")
          PROJECT_ID=$(node -p "require('./apps/$APP/.vercel/project.json').projectId")
          export VERCEL_ORG_ID="$ORG_ID"
          export VERCEL_PROJECT_ID="$PROJECT_ID"

          # Ensure the Vercel project builds from apps/<app> while receiving the
          # full monorepo upload from the repository root.
          team_qs=""
          if [[ "$ORG_ID" == team_* ]]; then
            team_qs="?teamId=$ORG_ID"
          fi
          curl -sS -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID${team_qs}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"rootDirectory\":\"apps/$APP\"}" >/dev/null

          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed $APP -> $url"
          {
            echo "### Vercel Deploy: $APP"
            echo "URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
